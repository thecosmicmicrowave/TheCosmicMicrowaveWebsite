{{/* Flat starfield. Positions are hashed from the index so the field is stable
     between builds. Pass "seed" to vary it between pages. */}}
{{ $seed := .seed | default "a" }}
<svg class="stars" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
  {{ range seq 170 }}
  {{ $x := mod (hash.FNV32a (printf "%sx%d" $seed .)) 1600 }}
  {{ $y := mod (hash.FNV32a (printf "%sy%d" $seed .)) 900 }}
  {{ $k := mod . 12 }}
  {{ if eq $k 0 }}<path class="stars__spark{{ if eq (mod . 24) 0 }} is-red{{ else }} is-violet{{ end }}" d="M{{ $x }} {{ sub $y 9 }}l2 7 7 2-7 2-2 7-2-7-7-2 7-2z"/>
  {{ else }}<circle cx="{{ $x }}" cy="{{ $y }}" r="{{ if lt $k 3 }}1.6{{ else if lt $k 7 }}1.1{{ else }}0.7{{ end }}"/>{{ end }}
  {{ end }}
</svg>
