{{ define "main" }}
<section class="section page-head post-hero">
  <div class="container">
    <h1 class="page-head__title">{{ .Title }}</h1>
    <p class="date">
      {{ partial "icon.html" (dict "name" "calendar" "class" "icon-sm" "size" 16) }}
      {{ .Date.Format "January 2, 2006" }}
    </p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="post-body">
      {{ .Content }}
    </div>
    <div class="post-back">
      <a href="/#news" class="btn btn--secondary">
        {{ partial "icon.html" (dict "name" "arrow-right" "class" "icon-sm" "size" 18) }}
        Back to news
      </a>
    </div>
  </div>
</section>
{{ end }}
