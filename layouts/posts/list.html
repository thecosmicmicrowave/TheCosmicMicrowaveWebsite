{{ define "title" }}All News | FTC 35817{{ end }}
{{ define "main" }}
<section class="section page-head">
  <div class="container">
    <h1 class="page-head__title">All News</h1>
    <p class="page-head__lead">Updates from The Cosmic Microwave.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    {{ if .Pages }}
    <div class="rows">
      {{ range .Pages }}
      <article class="post-row">
        <p class="date">{{ .Date.Format "January 2, 2006" }}</p>
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        <p>{{ .Summary }}</p>
      </article>
      {{ end }}
    </div>
    {{ else }}
    <p class="news-empty">No news yet &mdash; check back soon.</p>
    {{ end }}
  </div>
</section>
{{ end }}
